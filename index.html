<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>삼성 POC 영상 제작 현황</title>
<style>
  :root{
    --bg:#F4F6F9; --surface:#fff; --surface-2:#EEF1F6; --ink:#18202E; --muted:#5C6675; --faint:#8A94A3; --border:#E2E7EE;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 26px rgba(16,24,40,.06);
    --c-product:#2559C7; --c-sales:#0E8C86; --c-tax:#B67A16; --c-health:#2E8B57; --danger:#C8372D; --accent:#2559C7;
    --sans:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){ :root{
    --bg:#0D141F; --surface:#151E2B; --surface-2:#1D2836; --ink:#E7ECF3; --muted:#9AA5B4; --faint:#6B7686; --border:#26313F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.38);
    --c-product:#5B8CF0; --c-sales:#33B3AC; --c-tax:#D69B3F; --c-health:#54B37E; --danger:#E5675D; --accent:#5B8CF0; color-scheme:dark; } }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased;}
  button,input,select{font:inherit; color:inherit;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px;}
  header.top{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--border);}
  .top-in{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 0;}
  .brand{margin-right:auto; display:flex; flex-direction:column; gap:2px; min-width:0;}
  .eyebrow{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint);}
  h1{font-size:20px; font-weight:900; margin:0; letter-spacing:-.01em;}
  .total{display:flex; align-items:baseline; gap:7px; padding:8px 14px; border:1px solid var(--border); border-radius:11px; background:var(--surface);}
  .total b{font-family:var(--mono); font-size:20px;} .total span{font-size:12px; color:var(--muted);}
  .lock{width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--faint); display:grid; place-items:center; cursor:pointer;}
  .lock:hover{color:var(--ink);} .lock svg{width:16px; height:16px;}
  .admin-tools{display:flex; gap:8px; align-items:center;}
  .admin-tools[hidden]{display:none;}
  .btn{border:1px solid var(--border); background:var(--surface); border-radius:9px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;}
  .btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--border));}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .summary{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 0 2px;}
  .stile{background:var(--surface); border:1px solid var(--border); border-top:3px solid var(--sc); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:5px; box-shadow:var(--shadow); text-decoration:none; color:inherit;}
  .stile .sname{font-size:12.5px; font-weight:700; color:var(--muted);} .stile .sname small{font-weight:600; color:var(--sc); margin-left:4px; font-size:11px;}
  .stile .snum{font-family:var(--mono); font-size:27px; font-weight:600; color:var(--sc); line-height:1;}
  .stile .snum small{font-size:12.5px; color:var(--muted); margin-left:2px;}
  @media (max-width:560px){ .summary{grid-template-columns:repeat(2,1fr);} h1{font-size:18px;} }
  .lede{color:var(--muted); font-size:13px; padding:12px 0 4px; margin:0;}
  .lede .warn{color:var(--danger);}
  main{padding:8px 0 44px; display:flex; flex-direction:column; gap:30px;}
  section.cat{scroll-margin-top:78px;}
  .cat-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:6px;}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--cat); box-shadow:0 0 0 4px color-mix(in srgb,var(--cat) 18%,transparent);}
  .cat-name{font-size:16px; font-weight:800;} .cat-sub{font-size:12px; color:var(--faint);}
  .cat-note{font-size:11.5px; font-weight:600; color:var(--cat); white-space:nowrap;}
  .count{margin-left:auto; font-family:var(--mono); font-weight:600; font-size:13px; color:var(--cat); background:color-mix(in srgb,var(--cat) 12%,var(--surface)); border:1px solid color-mix(in srgb,var(--cat) 30%,transparent); padding:4px 11px; border-radius:999px;}
  .substyle{display:flex; align-items:center; gap:11px; padding:14px 2px 6px;}
  .substyle .sname{font-size:13.5px; font-weight:700;} .substyle .bar{flex:1; height:1px; background:var(--border);}
  .substyle .scount{font-family:var(--mono); font-size:12px; color:var(--cat); background:color-mix(in srgb,var(--cat) 12%,var(--surface)); border:1px solid color-mix(in srgb,var(--cat) 28%,transparent); padding:2px 10px; border-radius:999px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; margin:6px 0 4px;}
  @media (max-width:560px){ .grid{grid-template-columns:repeat(2,1fr); gap:10px;} }
  .card{margin:0; background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; min-width:0;}
  .thumb{position:relative; display:block; width:100%; aspect-ratio:16/9; border:0; padding:0; background:#0B1119; cursor:pointer; overflow:hidden;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .25s;}
  .thumb:hover img{transform:scale(1.03);}
  .thumb.noimg img{display:none;}
  .badge{position:absolute; left:8px; top:8px; background:rgba(0,0,0,.72); color:#fff; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; z-index:1;}
  .pnote{display:none; padding:10px 14px; font-size:12.5px; background:#2A2410; color:#F3D98B; border-bottom:1px solid #3a3218;}
  #dPlay.pending .pnote{display:block;}
  .tload{margin-top:12px; font-size:12.5px; color:var(--muted);}
  .tload .pbar{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:6px;}
  .tload .pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s;}
  .or{font-size:12px; color:var(--faint); text-align:center; margin:12px 0 8px;}
  .thumb.noimg::after{content:"미리보기 준비 중"; position:absolute; inset:0; display:grid; place-items:center; font-size:12px; color:#8A94A3;}
  .card figcaption{padding:9px 11px 10px; font-size:12.5px; font-weight:600; line-height:1.35; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tools{display:none; gap:6px; padding:0 10px 10px; flex-wrap:wrap;}
  body.admin .tools{display:flex;}
  .tools button{flex:1; border:1px solid var(--border); background:var(--surface-2); border-radius:7px; padding:4px 6px; font-size:11.5px; font-weight:700; cursor:pointer;}
  .tools button.del{color:var(--danger);}
  .empty{color:var(--faint); font-size:13px; padding:10px 2px;}

  dialog{border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--ink); padding:0; box-shadow:0 24px 70px rgba(0,0,0,.35); max-width:calc(100vw - 32px);}
  dialog::backdrop{background:rgba(8,12,20,.62);}
  .dh{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--border);}
  .dh b{font-size:14.5px; margin-right:auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .x{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface); cursor:pointer; font-size:16px; line-height:1; flex:none;}
  .db{padding:14px;} .df{display:flex; justify-content:flex-end; gap:8px; padding:12px 14px; border-top:1px solid var(--border); align-items:center;}
  .df .note{margin-right:auto; font-size:12px; color:var(--muted);}
  #dPlay{width:min(960px,calc(100vw - 32px)); background:#000; border-color:#222;}
  #dPlay .dh{background:var(--surface);}
  .frame{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  .frame iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
  .field label{font-size:12px; font-weight:700; color:var(--muted);}
  input[type=password],select{border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:9px 11px; font-size:14px; width:100%;}
  select.missing{border-color:var(--danger); box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent);}
  .err{color:var(--danger); font-size:12.5px; min-height:1em;}

  #dUp{width:min(1000px,calc(100vw - 32px));}
  #dUp .db{max-height:calc(100vh - 220px); overflow:auto;}
  .drop{display:block; border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; color:var(--muted); font-size:13.5px; cursor:pointer; background:var(--surface-2);}
  .drop.over{border-color:var(--accent); color:var(--accent);}
  .drop b{color:var(--ink);}
  .bulk{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:12px 0 4px; font-size:12.5px; color:var(--muted);}
  .bulk select{width:auto; padding:6px 9px; font-size:13px;}
  .uitem{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr) auto; gap:14px; padding:14px 0; border-bottom:1px solid var(--border);}
  .uitem.focus{background:color-mix(in srgb,var(--accent) 6%,transparent); border-radius:10px;}
  @media (max-width:700px){ .uitem{grid-template-columns:1fr auto;} .uitem .uvid{grid-column:1 / -1;} }
  .uvid video{width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; display:block; object-fit:contain;}
  .scrub{width:100%; margin:8px 0 4px;}
  .urow{display:flex; align-items:center; gap:8px;} .tc{font-family:var(--mono); font-size:12px; color:var(--muted); margin-right:auto;}
  .umeta{display:flex; flex-direction:column; gap:8px; min-width:0;}
  .uname{font-size:13px; font-weight:700; word-break:break-all;}
  .usel{display:grid; grid-template-columns:1fr 1.4fr; gap:8px;}
  .usel select{padding:7px 9px; font-size:13px;}
  .uthumb{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted);}
  .uthumb img{width:112px; aspect-ratio:16/9; object-fit:cover; border-radius:6px; background:var(--surface-2); border:1px solid var(--border);}
  .uthumb img:not([src]){visibility:hidden;}
  .uthumb .ok{color:var(--c-health); font-weight:700;}
  .uprog{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted);}
  .uprog .pbar{flex:1; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .uprog .pbar i{display:block; height:100%; width:0; background:var(--accent); transition:width .2s;}
  .uitem.done .pbar i{background:var(--c-health);} .uitem.fail .ust{color:var(--danger);}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; transition:.25s; z-index:100; pointer-events:none; max-width:calc(100vw - 32px);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #dThumb{width:min(620px,calc(100vw - 32px));}
  #dThumb .db{max-height:calc(100vh - 170px); overflow:auto;}
  #dThumb video,#dThumb .tprev{width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; object-fit:contain; display:block;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <div class="brand"><span class="eyebrow">Samsung Life · PoC</span><h1>삼성 POC 영상 제작 현황</h1></div>
  <div class="admin-tools" id="adminTools" hidden>
    <button class="btn primary" id="btnUpload">영상 업로드</button>
    <button class="btn" id="btnPw">암호 변경</button>
    <button class="btn" id="btnLogout">관리 종료</button>
  </div>
  <div class="total"><b id="total">0</b><span>편</span></div>
  <button class="lock hidden" id="btnAdmin" title="관리자" aria-label="관리자 로그인"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
</div></header>

<div class="wrap">
  <div class="summary" id="summary"></div>
  <p class="lede" id="lede">썸네일을 누르면 영상이 재생됩니다.</p>
</div>
<main class="wrap" id="main"></main>

<dialog id="dPlay"><div class="dh"><b id="playTitle"></b><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="pnote">방금 올라온 영상이라 구글 드라이브가 재생용으로 변환하는 중입니다. 변환이 끝나면 이 창에서 바로 재생됩니다.</div>
  <div class="frame"><iframe id="playFrame" allow="autoplay; fullscreen"></iframe></div></dialog>

<dialog id="dLogin" style="width:min(380px,calc(100vw - 32px))"><form method="dialog" id="fLogin">
  <div class="dh"><b>관리자</b><button type="button" class="x" data-close aria-label="닫기">×</button></div>
  <div class="db"><div class="field"><label for="pw">관리자 암호</label><input type="password" id="pw" autocomplete="current-password"></div><div class="err" id="loginErr"></div></div>
  <div class="df"><button type="button" class="btn" data-close>취소</button><button class="btn primary" id="btnLogin" value="ok">확인</button></div>
</form></dialog>

<dialog id="dUp">
  <div class="dh"><b>영상 업로드</b><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db">
    <label class="drop" id="drop"><input type="file" id="fileIn" accept="video/*" multiple hidden>
      <b>영상 파일을 끌어다 놓거나 클릭해서 선택</b><br>여러 개를 한 번에 올릴 수 있습니다. 각 영상마다 카테고리와 썸네일 장면을 지정하세요.</label>
    <div class="bulk" id="bulk" hidden>일괄 지정:
      <select id="bulkCat"></select><select id="bulkStyle"></select><button class="btn sm" id="bulkApply">카테고리 미지정 항목에 적용</button>
    </div>
    <div id="ulist"></div>
  </div>
  <div class="df"><span class="note" id="upNote"></span><button class="btn" data-close>닫기</button><button class="btn primary" id="btnStart" disabled>업로드 시작</button></div>
</dialog>

<dialog id="dThumb">
  <div class="dh"><b id="thumbTitle">썸네일 변경</b><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db">
    <div class="tload" id="tLoad"><span id="tLoadMsg">드라이브에서 원본 영상을 불러오는 중…</span><div class="pbar"><i id="tLoadBar"></i></div></div>
    <div id="tvid" class="hidden" style="margin-top:12px">
      <video id="tVideo" muted playsinline preload="auto"></video>
      <input type="range" class="scrub" id="tScrub" min="0" max="1000" value="0">
      <div class="urow"><span class="tc" id="tTc">0:00</span><button class="btn sm" id="tCap">이 장면을 썸네일로</button></div>
    </div>
    <div class="uthumb" style="margin-top:12px"><img id="tPrev" alt=""><span id="tMsg">아직 지정 안 됨</span></div>
    <div class="or">또는</div>
    <label class="drop" id="tdrop" style="padding:12px"><input type="file" id="tIn" accept="video/*,image/*" hidden><b>내 PC의 영상·이미지 파일로 지정</b></label>
  </div>
  <div class="df"><button class="btn" data-close>취소</button><button class="btn primary" id="tSave" disabled>저장</button></div>
</dialog>

<dialog id="dMove" style="width:min(440px,calc(100vw - 32px))">
  <div class="dh"><b id="moveTitle">카테고리 이동</b><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db"><div class="field"><label>카테고리</label><select id="mCat"></select></div><div class="field"><label>세부 유형</label><select id="mStyle"></select></div></div>
  <div class="df"><button class="btn" data-close>취소</button><button class="btn primary" id="mSave">이동</button></div>
</dialog>

<dialog id="dDel" style="width:min(420px,calc(100vw - 32px))">
  <div class="dh"><b>영상 삭제</b><button class="x" data-close aria-label="닫기">×</button></div>
  <div class="db" id="delMsg" style="font-size:13.5px"></div>
  <div class="df"><button class="btn" data-close>취소</button><button class="btn danger" id="delOk">삭제</button></div>
</dialog>

<dialog id="dPw" style="width:min(400px,calc(100vw - 32px))"><form method="dialog" id="fPw">
  <div class="dh"><b>관리자 암호 변경</b><button type="button" class="x" data-close aria-label="닫기">×</button></div>
  <div class="db"><div class="field"><label for="pw1">새 암호 (6자 이상)</label><input type="password" id="pw1" autocomplete="new-password"></div>
  <div class="field"><label for="pw2">새 암호 확인</label><input type="password" id="pw2" autocomplete="new-password"></div><div class="err" id="pwErr"></div></div>
  <div class="df"><button type="button" class="btn" data-close>취소</button><button class="btn primary" id="btnPwSave" value="ok">변경</button></div>
</form></dialog>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* ===== 설정 ===== */
const API_URL = window.POC_API_URL || ""; // Apps Script 웹앱 주소는 config.js에서 지정 (없으면 고정 목록으로 표시)

const CATS=[
  {key:"product", prefix:"상품안내", label:"① 상품 안내", sub:"건강보험·암·치매·종신 등", note:"(+기타 카테고리 포함)", c:"var(--c-product)"},
  {key:"sales",   prefix:"영업화법", label:"② 영업화법", sub:"화법·리크루팅 화법", c:"var(--c-sales)"},
  {key:"tax",     prefix:"세금",     label:"③ 세금",     sub:"택슈어런스", c:"var(--c-tax)"},
  {key:"health",  prefix:"건강정보", label:"④ 건강정보", sub:"질환 정보·치료 트렌드", c:"var(--c-health)"},
];
const STYLES=["① 와카스튜디오 제공 컨셉 활용형","② 캐릭터 로테이션 시리즈","③ 보험 에피소드형","④ 비추미 마스코트 활용형","⑤ 영업화법 기본형(롤플레잉)","⑥ 신규 템플릿(퀴즈쇼 등)","⑦ 일반 이미지썰","⑧ 썰+생성형 결합형","기타"];
const CAT_STYLES={

let folders=[];      // [{name, files:[{id,title,thumb}]}]
let adminKey=sstore.get("poc_admin")||"";

function parseFolder(name){
  const i=name.indexOf("_"); if(i<0) return null;
  const prefix=name.slice(0,i).trim(), style=name.slice(i+1).trim();
  const cat=CATS.find(c=>c.prefix===prefix); if(!cat) return null;
  return {cat, style};
}
function styleOrder(s){ const i=STYLES.indexOf(s); return i<0?99:i; }

function render(){
  const byCat={}; let total=0;
  CATS.forEach(c=>byCat[c.key]=[]);
  folders.forEach(f=>{ const p=parseFolder(f.name); if(!p||!f.files.length) return; byCat[p.cat.key].push({style:p.style, files:f.files.slice().sort((a,b)=>coll.compare(a.title,b.title))}); });
  let tiles="", html="";
  CATS.forEach(c=>{
    const groups=byCat[c.key].sort((a,b)=>styleOrder(a.style)-styleOrder(b.style)||coll.compare(a.style,b.style));
    const n=groups.reduce((a,g)=>a+g.files.length,0); total+=n;
    tiles+=`<a class="stile" href="#sec-${c.key}" style="--sc:${c.c}"><div class="sname">${esc(c.label)}</div><div class="snum">${n}<small>편</small></div></a>`;
    let body="";
    groups.forEach(g=>{
      body+=`<div class="substyle"><span class="sname">${esc(g.style.replace(/^[\u2460-\u2473]\s*/,""))}</span><span class="bar"></span><span class="scount">${g.files.length}편</span></div><div class="grid">`;
      g.files.forEach(f=>{
        body+=`<figure class="card" data-id="${esc(f.id)}"><button class="thumb" data-play="${esc(f.id)}" aria-label="${esc(f.title)} 재생">${f.ready===false?'<span class="badge">드라이브 변환 중</span>':''}<img loading="lazy" src="${esc(thumbUrl(f))}" alt="" onerror="this.parentNode.classList.add('noimg')"></button>`+
          `<figcaption title="${esc(f.title)}">${esc(f.title)}</figcaption>`+
          `<div class="tools"><button data-act="thumb">썸네일</button><button data-act="move">이동</button><button data-act="del" class="del">삭제</button></div></figure>`;
      });
      body+=`</div>`;
    });
    if(!groups.length) body=`<div class="empty">아직 등록된 영상이 없습니다.</div>`;
    html+=`<section class="cat" id="sec-${c.key}" style="--cat:${c.c}"><div class="cat-head"><span class="dot"></span><span class="cat-name">${esc(c.label)}</span>${c.note?`<span class="cat-note">${esc(c.note)}</span>`:""}<span class="cat-sub">${esc(c.sub)}</span><span class="count">${n}편</span></div>${body}</section>`;
  });
  $("summary").innerHTML=tiles; $("main").innerHTML=html; $("total").textContent=total;
}
function findFile(id){ for(const f of folders){ const x=f.files.find(v=>v.id===id); if(x) return {folder:f, file:x}; } return null; }

async function load(){
  const cached=store.get("poc_list_v1");
  if(cached){ try{ folders=JSON.parse(cached); }catch(e){ folders=FALLBACK; } } else folders=FALLBACK;
  render();
  if(!API_URL) return;
  $("btnAdmin").classList.remove("hidden");
  try{
    const r=await fetch(API_URL,{cache:"no-store"}); const j=await r.json();
    if(!j.ok) throw new Error(j.error);
    folders=j.folders; store.set("poc_list_v1",JSON.stringify(folders)); render();
  }catch(e){ console.warn("목록 갱신 실패",e); }
}

/* ===== 재생 ===== */
document.addEventListener("click",e=>{
  const p=e.target.closest("[data-play]");
  if(p){ const r=findFile(p.dataset.play); $("playTitle").textContent=r?r.file.title:""; $("dPlay").classList.toggle("pending",!!(r&&r.file.ready===false)); $("playFrame").src="https://drive.google.com/file/d/"+encodeURIComponent(p.dataset.play)+"/preview"; $("dPlay").showModal(); return; }
  const t=e.target.closest(".tools button");
  if(t){ const id=t.closest(".card").dataset.id; const act=t.dataset.act; if(act==="thumb") openThumb(id); else if(act==="move") openMove(id); else openDel(id); }
});
$("dPlay").addEventListener("close",()=>{ $("playFrame").src="about:blank"; });

/* ===== 관리자 ===== */
async function api(body){
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(Object.assign({key:adminKey},body))});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||"요청 실패"); return j;
}
function setAdmin(on){ document.body.classList.toggle("admin",on); $("adminTools").hidden=!on; $("btnAdmin").classList.toggle("hidden",on||!API_URL); }
$("btnAdmin").onclick=()=>{ $("pw").value=""; $("loginErr").textContent=""; $("dLogin").showModal(); $("pw").focus(); };
$("fLogin").addEventListener("submit",async e=>{
  e.preventDefault(); const pw=$("pw").value.trim(); if(!pw) return;
  $("btnLogin").disabled=true; $("loginErr").textContent="확인 중…";
  const prev=adminKey; adminKey=pw;
  try{ await api({action:"check"}); sstore.set("poc_admin",pw); setAdmin(true); $("dLogin").close(); toast("관리 모드"); }
  catch(err){ adminKey=prev; $("loginErr").textContent=err.message==="unauthorized"?"암호가 맞지 않습니다.":"확인 실패: "+err.message; }
  finally{ $("btnLogin").disabled=false; }
});
$("btnLogout").onclick=()=>{ adminKey=""; sstore.del("poc_admin"); setAdmin(false); };
async function reload(){ try{ const r=await fetch(API_URL,{cache:"no-store"}); const j=await r.json(); if(j.ok){ folders=j.folders; store.set("poc_list_v1",JSON.stringify(folders)); render(); } }catch(e){} }

function fillCat(sel,val,placeholder){ sel.innerHTML=(placeholder?`<option value="">${placeholder}</option>`:"")+CATS.map(c=>`<option value="${c.key}">${esc(c.label.replace(/^[①-④]\s*/,""))}</option>`).join(""); sel.value=val||""; }
function fillStyle(sel,catKey,val,placeholder){ const idx=catKey?CAT_STYLES[catKey]:[]; let opts=idx.map(i=>STYLES[i]); if(val&&!opts.includes(val)) opts.push(val); sel.innerHTML=`<option value="">${placeholder||"세부 유형 선택"}</option>`+opts.map(s=>`<option>${esc(s)}</option>`).join(""); sel.value=val||""; sel.disabled=!catKey; }
const folderName=(catKey,style)=>CATS.find(c=>c.key===catKey).prefix+"_"+style;

/* 프레임 캡처 */
function capture(video){
  const w=Math.min(960,video.videoWidth||640), h=Math.round(w*(video.videoHeight||360)/(video.videoWidth||640));
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(video,0,0,w,h);
  return cv.toDataURL("image/jpeg",0.85);
}
function imageToJpeg(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const w=Math.min(960,img.naturalWidth), h=Math.round(w*img.naturalHeight/img.naturalWidth); const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(img.src); res(cv.toDataURL("image/jpeg",0.85)); }; img.onerror=rej; img.src=URL.createObjectURL(file); }); }
function bindScrub(video,range,tc){
  range.addEventListener("input",()=>{ if(video.duration) video.currentTime=video.duration*range.value/1000; });
  video.addEventListener("timeupdate",()=>{ tc.textContent=fmt(video.currentTime)+" / "+fmt(video.duration); });
  video.addEventListener("loadedmetadata",()=>{ tc.textContent=fmt(0)+" / "+fmt(video.duration); });
}

/* ===== 업로드 ===== */
let items=[]; let uploading=false;
$("btnUpload").onclick=()=>{ $("dUp").showModal(); };
fillCat($("bulkCat"),"","카테고리"); fillStyle($("bulkStyle"),"","","세부 유형");
$("bulkCat").onchange=()=>fillStyle($("bulkStyle"),$("bulkCat").value,"","세부 유형");
$("bulkApply").onclick=()=>{ const c=$("bulkCat").value, s=$("bulkStyle").value; items.forEach(it=>{ if(it.state!=="idle"&&it.state!=="fail") return; if(c&&!it.cat){ it.cat=c; fillCat(it.el.querySelector(".scat"),c,"카테고리 선택"); fillStyle(it.el.querySelector(".sstyle"),c,s||"",""); it.style=s||""; it.el.querySelectorAll(".missing").forEach(n=>{ if(n.value) n.classList.remove("missing"); }); } }); validate(); };
const drop=$("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault(); drop.classList.remove("over");}));
drop.addEventListener("drop",e=>addFiles(e.dataTransfer.files));
$("fileIn").onchange=e=>{ addFiles(e.target.files); e.target.value=""; };

function addFiles(list){
  [...list].filter(f=>/^video\//.test(f.type)||/\.(mp4|mov|m4v|webm)$/i.test(f.name)).forEach(file=>{
    const it={file, cat:"", style:"", thumb:null, state:"idle", url:URL.createObjectURL(file)};
    const el=document.createElement("div"); el.className="uitem"; it.el=el;
    el.innerHTML=`<div class="uvid"><video muted playsinline preload="auto" src="${it.url}"></video><input type="range" class="scrub" min="0" max="1000" value="0"><div class="urow"><span class="tc">0:00</span><button class="btn sm cap">이 장면을 썸네일로</button></div></div>
      <div class="umeta"><div class="uname">${esc(file.name)}</div><div class="usel"><select class="scat"></select><select class="sstyle"></select></div>
      <div class="uthumb"><img alt=""><span class="tmsg">썸네일 미지정 · 위 막대로 장면을 고른 뒤 지정</span></div>
      <div class="uprog"><div class="pbar"><i></i></div><span class="ust">대기</span></div></div>
      <button class="x rm" aria-label="목록에서 빼기">×</button>`;
    const v=el.querySelector("video");
    bindScrub(v,el.querySelector(".scrub"),el.querySelector(".tc"));
    fillCat(el.querySelector(".scat"),"","카테고리 선택"); fillStyle(el.querySelector(".sstyle"),"","","세부 유형 선택");
    el.querySelector(".scat").onchange=e=>{ e.target.classList.remove("missing"); it.cat=e.target.value; it.style=""; fillStyle(el.querySelector(".sstyle"),it.cat,"",""); validate(); };
    el.querySelector(".sstyle").onchange=e=>{ e.target.classList.remove("missing"); it.style=e.target.value; validate(); };
    el.querySelector(".cap").onclick=()=>{
      if(!v.videoWidth){ toast("영상을 불러오는 중입니다"); return; }
      it.thumb=capture(v); el.querySelector(".uthumb img").src=it.thumb;
      el.querySelector(".tmsg").innerHTML=`<span class="ok">썸네일 지정됨</span> (${fmt(v.currentTime)})`;
      const next=items.find(x=>x!==it&&!x.thumb&&x.state==="idle");
      items.forEach(x=>x.el.classList.remove("focus"));
      if(next){ next.el.classList.add("focus"); next.el.scrollIntoView({behavior:"smooth",block:"center"}); next.el.querySelector(".scrub").focus({preventScroll:true}); }
    };
    el.querySelector(".rm").onclick=()=>{ if(it.state==="uploading") return; URL.revokeObjectURL(it.url); el.remove(); items=items.filter(x=>x!==it); validate(); };
    $("ulist").appendChild(el); items.push(it);
  });
  validate();
}
function validate(){
  const pending=items.filter(it=>it.state==="idle"||it.state==="fail");
  $("bulk").hidden=!items.length;
  const noThumb=pending.filter(it=>!it.thumb).length;
  $("upNote").textContent=pending.length?`${pending.length}개 대기`+(noThumb?` · 썸네일 미지정 ${noThumb}개(드라이브 자동 썸네일 사용)`:""):(items.length?"완료":"");
  $("btnStart").disabled=uploading||!pending.length;
}
function putFile(url,file,onp){ return new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open("PUT",url); x.upload.onprogress=e=>{ if(e.lengthComputable) onp(e.loaded/e.total); }; x.onload=()=>{ if(x.status>=200&&x.status<300){ try{ res(JSON.parse(x.responseText)); }catch(e){ rej(new Error("응답 해석 실패")); } } else rej(new Error("업로드 실패 ("+x.status+")")); }; x.onerror=()=>rej(new Error("네트워크 오류")); x.send(file); }); }
$("btnStart").onclick=async()=>{
  const pending=items.filter(it=>it.state==="idle"||it.state==="fail");
  let bad=false;
  pending.forEach(it=>{ const sc=it.el.querySelector(".scat"), ss=it.el.querySelector(".sstyle"); sc.classList.toggle("missing",!it.cat); ss.classList.toggle("missing",!it.style); if(!it.cat||!it.style) bad=true; });
  if(bad){ toast("카테고리와 세부 유형을 모두 지정하세요"); return; }
  uploading=true; validate(); let ok=0;
  for(const it of pending){
    const bar=it.el.querySelector(".pbar i"), st=it.el.querySelector(".ust");
    it.state="uploading"; it.el.classList.remove("fail"); st.textContent="준비 중…"; it.el.querySelectorAll("select,.cap,.scrub").forEach(n=>n.disabled=true);
    try{
      const s=await api({action:"init", folder:folderName(it.cat,it.style), name:it.file.name, size:it.file.size, mime:it.file.type||"video/mp4", origin:location.origin});
      const res=await putFile(s.uploadUrl,it.file,p=>{ bar.style.width=(p*100).toFixed(1)+"%"; st.textContent=Math.round(p*100)+"%"; });
      st.textContent="마무리 중…";
      await api({action:"done", fileId:res.id, thumb:it.thumb||null});
      it.state="done"; it.el.classList.add("done"); bar.style.width="100%"; st.textContent="완료"; ok++;
    }catch(err){ it.state="fail"; it.el.classList.add("fail"); st.textContent="실패: "+err.message; it.el.querySelectorAll("select,.cap,.scrub").forEach(n=>n.disabled=false); }
  }
  uploading=false; validate();
  if(ok){ toast(ok+"개 업로드 완료"); await reload(); }
};

/* ===== 썸네일 변경 ===== */
let tTarget=null, tData=null, tJob=0;
const CHUNK=8*1024*1024;
function setVideoSrc(url){ const v=$("tVideo"); if(v.src&&v.src.startsWith("blob:")) URL.revokeObjectURL(v.src); v.src=url; $("tScrub").value=0; $("tvid").classList.remove("hidden"); }
async function loadFromDrive(id, job){
  const bar=$("tLoadBar"), msg=$("tLoadMsg"); $("tLoad").classList.remove("hidden"); bar.style.width="0%"; msg.textContent="드라이브에서 원본 영상을 불러오는 중…";
  try{
    const m=await api({action:"meta", fileId:id}); if(job!==tJob) return;
    const n=Math.ceil(m.size/CHUNK); const parts=new Array(n); let done=0, next=0;
    async function worker(){ while(next<n){ const i=next++; const s=i*CHUNK, e=Math.min(m.size,s+CHUNK)-1;
      const j=await api({action:"chunk", fileId:id, start:s, end:e}); if(job!==tJob) throw new Error("cancel");
      parts[i]=await (await fetch("data:application/octet-stream;base64,"+j.b64)).arrayBuffer();
      done++; bar.style.width=(done/n*100).toFixed(0)+"%"; msg.textContent=`드라이브에서 원본 영상을 불러오는 중… ${Math.round(done/n*100)}% (${(m.size/1048576).toFixed(1)}MB)`; } }
    await Promise.all([worker(),worker(),worker()].slice(0,Math.max(1,Math.min(3,n))));
    if(job!==tJob) return;
    setVideoSrc(URL.createObjectURL(new Blob(parts,{type:m.mime||"video/mp4"})));
    $("tLoad").classList.add("hidden");
  }catch(err){ if(job!==tJob||err.message==="cancel") return; msg.textContent="원본을 불러오지 못했습니다 ("+err.message+"). 아래에서 PC 파일로 지정할 수 있습니다."; }
}
function openThumb(id){
  const r=findFile(id); if(!r) return; tTarget=id; tData=null; const job=++tJob;
  $("thumbTitle").textContent="썸네일 변경 · "+r.file.title; $("tvid").classList.add("hidden"); $("tPrev").removeAttribute("src"); $("tMsg").textContent="아직 지정 안 됨"; $("tSave").disabled=true;
  $("dThumb").showModal(); loadFromDrive(id, job);
}
$("dThumb").addEventListener("close",()=>{ tJob++; const v=$("tVideo"); v.pause(); if(v.src&&v.src.startsWith("blob:")){ URL.revokeObjectURL(v.src); } v.removeAttribute("src"); v.load(); });
bindScrub($("tVideo"),$("tScrub"),$("tTc"));
$("tIn").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return; tJob++; $("tLoad").classList.add("hidden");
  if(/^image\//.test(f.type)){ $("tvid").classList.add("hidden"); tData=await imageToJpeg(f); $("tPrev").src=tData; $("tMsg").innerHTML='<span class="ok">이미지로 지정됨</span>'; $("tSave").disabled=false; }
  else setVideoSrc(URL.createObjectURL(f));
};
$("tCap").onclick=()=>{ const v=$("tVideo"); if(!v.videoWidth){ toast("영상을 불러오는 중입니다"); return; } tData=capture(v); $("tPrev").src=tData; $("tMsg").innerHTML=`<span class="ok">장면 지정됨</span> (${fmt(v.currentTime)})`; $("tSave").disabled=false; };
$("tSave").onclick=async()=>{
  if(!tData||!tTarget) return; $("tSave").disabled=true; $("tMsg").textContent="저장 중…";
  try{ const j=await api({action:"thumb", fileId:tTarget, thumb:tData}); const r=findFile(tTarget); if(r) r.file.thumb=j.thumb; render(); $("dThumb").close(); toast("썸네일 저장됨"); reload(); }
  catch(err){ $("tMsg").textContent="실패: "+err.message; $("tSave").disabled=false; }
};

/* ===== 카테고리 이동 ===== */
let mTarget=null;
function openMove(id){
  const r=findFile(id); if(!r) return; mTarget=id; const p=parseFolder(r.folder.name);
  $("moveTitle").textContent="카테고리 이동 · "+r.file.title;
  fillCat($("mCat"),p?p.cat.key:"",""); fillStyle($("mStyle"),p?p.cat.key:"",p?p.style:"","");
  $("dMove").showModal();
}
$("mCat").onchange=()=>fillStyle($("mStyle"),$("mCat").value,"","");
$("mSave").onclick=async()=>{
  const c=$("mCat").value, s=$("mStyle").value; if(!c||!s){ toast("세부 유형을 선택하세요"); return; }
  $("mSave").disabled=true;
  try{
    const target=folderName(c,s); await api({action:"move", fileId:mTarget, folder:target});
    const r=findFile(mTarget); if(r){ r.folder.files=r.folder.files.filter(x=>x.id!==mTarget); let tf=folders.find(f=>f.name===target); if(!tf){ tf={name:target,files:[]}; folders.push(tf); } tf.files.push(r.file); }
    render(); $("dMove").close(); toast("이동 완료"); reload();
  }catch(err){ toast("이동 실패: "+err.message); }
  finally{ $("mSave").disabled=false; }
};

/* ===== 삭제 ===== */
let dTarget=null;
function openDel(id){ const r=findFile(id); if(!r) return; dTarget=id; $("delMsg").innerHTML=`<b>${esc(r.file.title)}</b><br><span style="color:var(--muted)">구글 드라이브 휴지통으로 옮깁니다. (30일 안에 드라이브에서 복구 가능)</span>`; $("dDel").showModal(); }
$("delOk").onclick=async()=>{
  $("delOk").disabled=true;
  try{ await api({action:"trash", fileId:dTarget}); const r=findFile(dTarget); if(r) r.folder.files=r.folder.files.filter(x=>x.id!==dTarget); render(); $("dDel").close(); toast("삭제됨"); reload(); }
  catch(err){ toast("삭제 실패: "+err.message); }
  finally{ $("delOk").disabled=false; }
};

/* ===== 암호 변경 ===== */
$("btnPw").onclick=()=>{ $("pw1").value=""; $("pw2").value=""; $("pwErr").textContent=""; $("dPw").showModal(); $("pw1").focus(); };
$("fPw").addEventListener("submit",async e=>{
  e.preventDefault(); const a=$("pw1").value.trim(), b=$("pw2").value.trim();
  if(a.length<6){ $("pwErr").textContent="6자 이상 입력하세요."; return; }
  if(a!==b){ $("pwErr").textContent="두 입력이 다릅니다."; return; }
  $("btnPwSave").disabled=true; $("pwErr").textContent="변경 중…";
  try{ await api({action:"setkey", newKey:a}); adminKey=a; sstore.set("poc_admin",a); $("dPw").close(); toast("암호가 변경되었습니다"); }
  catch(err){ $("pwErr").textContent=err.message==="unknown_action"?"백엔드가 아직 새 버전으로 배포되지 않았습니다.":"변경 실패: "+err.message; }
  finally{ $("btnPwSave").disabled=false; }
});

/* ===== 시작 ===== */
load().then(()=>{ if(adminKey&&API_URL) setAdmin(true); });
</script>
